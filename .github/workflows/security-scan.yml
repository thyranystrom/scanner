# ============================================================================
# woocommerce-security-scanner -- GitHub Actions CI
# ============================================================================
name: Security Scan & Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fail_severity:
        description: "Fail the pipeline at or above this severity (CRITICAL/HIGH/MEDIUM/LOW/NONE)"
        required: false
        default: "HIGH"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Lint & type check --------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: ruff – lint
        run: ruff check scanner/ tests/

      - name: ruff – format check
        run: ruff format --check scanner/ tests/

      - name: mypy – type check
        run: mypy scanner/ --ignore-missing-imports
        continue-on-error: true   # Warn-only until type annotations are complete

  # -- Unit tests ------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install PHP deps
        working-directory: scanner/php
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: pytest -q --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: .pytest_cache/
          retention-days: 7

  # -- Security scan -----------------------------------------------------------
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install PHP deps
        working-directory: scanner/php
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Restore AST cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/wc-scanner/ast
          key: ast-cache-${{ hashFiles('**/*.php') }}
          restore-keys: ast-cache-

      - name: Determine fail severity
        id: severity
        run: |
          INPUT="${{ github.event.inputs.fail_severity }}"
          REPO_VAR="${{ vars.FAIL_SEVERITY }}"
          echo "level=${INPUT:-${REPO_VAR:-HIGH}}" >> "$GITHUB_OUTPUT"

      - name: Run security scan
        id: scan
        run: |
          mkdir -p reports
          python -m scanner.main . \
            --json  reports/scan-results.json \
            --md    reports/scan-report.md \
            --fail-on-severity ${{ steps.severity.outputs.level }} \
            --min-confidence 0.30 \
            || echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          echo "## 🛡️ Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/scan-report.md ]; then
            cat reports/scan-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/scan-report.md')) return;
            const body = '<!-- wc-security-scan -->\n' + fs.readFileSync('reports/scan-report.md', 'utf8');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes('<!-- wc-security-scan -->'));
            const fn = existing ? 'updateComment' : 'createComment';
            const params = existing
              ? { owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body }
              : { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body };
            await github.rest.issues[fn](params);

      - name: Enforce severity gate
        if: steps.scan.outputs.exit_code != '' && steps.scan.outputs.exit_code != '0'
        run: |
          echo "❌ Findings at or above ${{ steps.severity.outputs.level }} detected."
          exit 1

  # -- Lab regression (external intentional-vuln repo) -----------------------
  # Clones a separate public repo that contains deliberate insecure PHP.
  # Fails the pipeline if the scanner stops reporting HIGH/CRITICAL there.
  # Main scanner repo stays free of vulnerable fixtures.
  lab-regression:
    name: Lab fixture regression
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install PHP parser
        working-directory: scanner/php
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Clone intentional vulnerable test plugin
        run: |
          git clone --depth 1 https://github.com/thyranystrom/scanner-vuln-test.git "$RUNNER_TEMP/scanner-vuln-test"

      - name: Scan lab repo (must find HIGH/CRITICAL)
        run: |
          mkdir -p reports
          python -m scanner.main "$RUNNER_TEMP/scanner-vuln-test" \
            --json reports/lab-scan.json \
            --md   reports/lab-scan.md \
            --min-confidence 0.30 \
            || true
          python - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("reports/lab-scan.json")
          if not path.is_file():
              print("ERROR: lab-scan.json missing — scanner did not write a report")
              sys.exit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          findings = data.get("findings") or []
          summary = data.get("summary") or {}
          # Prefer summary counts when present
          high = int(summary.get("HIGH", 0) or 0) + int(summary.get("CRITICAL", 0) or 0)
          if high == 0:
              high = sum(
                  1
                  for f in findings
                  if str(f.get("severity", "")).upper() in ("HIGH", "CRITICAL")
              )
          total = summary.get("findings", len(findings))
          print(f"Lab scan: {total} findings, HIGH/CRITICAL={high}")
          if high < 1:
              print("FAIL: scanner reported no HIGH/CRITICAL on scanner-vuln-test")
              print("Detection may have regressed.")
              sys.exit(1)
          print("OK: intentional vulnerabilities still detected")
          PY

      - name: Upload lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-scan-${{ github.run_number }}
          path: reports/lab-scan.*
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## Lab fixture regression (scanner-vuln-test)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/lab-scan.md ]; then
            cat reports/lab-scan.md >> "$GITHUB_STEP_SUMMARY"
          fi
