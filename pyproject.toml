[project]
name            = "woocommerce-security-scanner"
version         = "1.0.0"
description     = "Static security scanner for WooCommerce plugins"
readme          = "README.md"
requires-python = ">=3.11"
dependencies    = []

[project.scripts]
wc-scanner = "scanner.main:main"

[tool.setuptools]
packages = ["scanner", "scanner.rules"]

# ── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = false      # Start permissive; tighten gradually
warn_return_any        = true
warn_unused_ignores    = true
warn_redundant_casts   = true
disallow_untyped_defs  = false      # Enable once type annotations are complete
check_untyped_defs     = true
ignore_missing_imports = true       # Third-party libs often lack stubs

# Exclude generated/third-party files
exclude = ["scanner/php/"]

# ── ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line-length is handled by ruff.line-length above
    "B007",   # Loop variable not used (occurs legitimately in the scanner)
    "SIM108", # Ternary operator (sometimes clearer as if/else)
]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["F811"]   # Redefinition is fine in tests
"scanner/php/" = ["ALL"]

# ── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-q --tb=short"
